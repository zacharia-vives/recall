<!DOCTYPE html><html><head><meta charset="utf-8"><title>idb</title></head><body>
<pre id="out">testing</pre>
<script>
const out = document.getElementById("out");
const req = indexedDB.open("probe-db", 1);
req.onupgradeneeded = () => req.result.createObjectStore("t", { keyPath: "id" });
req.onsuccess = () => {
  const db = req.result;
  const tx = db.transaction("t", "readwrite");
  tx.objectStore("t").put({ id: 1, hello: "world" });
  tx.oncomplete = () => {
    const r2 = db.transaction("t", "readonly").objectStore("t").get(1);
    r2.onsuccess = () => { out.textContent = "IndexedDB works: " + JSON.stringify(r2.result); };
  };
};
req.onerror = () => { out.textContent = "IndexedDB error: " + req.error; };
req.onblocked = () => { out.textContent = "IndexedDB blocked"; };
</script></body></html>
